{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts: Source Serif Pro (the same family nikhilbasavappa.github.io uses) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* Base size: 19px on laptops, 20px on large screens (theme default is 18px).
     Set both to 18px if you want Nikhil's exact scale. */
  @media screen and (min-width: 768px)  { html { font-size: 19px; } }
  @media screen and (min-width: 1280px) { html { font-size: 20px; } }

  /* One serif everywhere — body, headings, menu, sidebar, footer.
     !important is needed because the theme sets the sidebar and menu
     to a sans-serif with rules that would otherwise win. */
  body, h1, h2, h3, h4, h5, h6,
  .masthead, .greedy-nav, .site-title,
  .sidebar, .sidebar p, .sidebar li,
  .author__name, .author__bio, .author__content, .author__urls, .author__urls a,
  .page__content, .page__footer, .archive, .list__item {
    font-family: "Source Serif Pro", Georgia, "Times New Roman", Times, serif !important;
  }

  /* Sidebar card, Nikhil's proportions */
  .author__avatar,
  .sidebar .author__avatar        { width: 170px; height: 170px; margin-bottom: 20px; }
  .author__avatar img,
  .sidebar .author__avatar img    { width: 170px; height: 170px; max-width: none; object-fit: cover; border-radius: 50%; }
  .sidebar .author__name          { font-size: 1.6em; font-weight: 600; margin-bottom: 10px; }
  .sidebar .author__bio           { font-size: 0.9em; margin-bottom: 15px; }
  .sidebar .author__urls li       { font-size: 0.9em; }
</style>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->
